name: BlacklistedAIProxy Deterministic Build

on:
  push:
    branches: [main, master]
    tags: ['v*']
  pull_request:
    branches: [main, master]
  workflow_dispatch:

permissions:
  contents: write

env:
  NODE_VERSION: 20.17.0
  GO_VERSION: 1.22.0

jobs:
  build:
    runs-on: windows-2025
    env:
      FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

    steps:

    # ─────────────────────────────────────────────
    # 1. SOURCE CHECKOUT
    # ─────────────────────────────────────────────
    - name: Checkout source
      uses: actions/checkout@v4.2.2

    # ─────────────────────────────────────────────
    # 2. VERSION RESOLUTION
    # ─────────────────────────────────────────────
    - name: Resolve version
      id: version
      shell: pwsh
      run: |
        $base = (Get-Content VERSION -Raw).Trim()
        $full = "$base-beta.1"
        "BASE=$base" | Out-File -FilePath $env:GITHUB_OUTPUT -Append
        "FULL=$full" | Out-File -FilePath $env:GITHUB_OUTPUT -Append
        Write-Host "Version locked: $full"

    # ─────────────────────────────────────────────
    # 3. TOOLCHAIN BOOTSTRAP
    # ─────────────────────────────────────────────
    - name: Setup Go (pinned)
      uses: actions/setup-go@v5.3.0
      with:
        go-version: ${{ env.GO_VERSION }}

    - name: Setup Node (pinned)
      uses: actions/setup-node@v4.3.0
      with:
        node-version: ${{ env.NODE_VERSION }}
        cache: npm

    # ─────────────────────────────────────────────
    # 4. JS DEPENDENCIES
    # ─────────────────────────────────────────────
    - name: Install dependencies
      shell: pwsh
      run: |
        npm ci --no-optional
        if ($LASTEXITCODE -ne 0) { exit 1 }

    # ─────────────────────────────────────────────
    # 5. BUILD GO SIDECAR
    # ─────────────────────────────────────────────
    - name: Build Go sidecar
      shell: pwsh
      working-directory: tls-sidecar
      env:
        CGO_ENABLED: "0"
        GOOS: windows
        GOARCH: amd64
      run: |
        go mod download
        go build -trimpath -ldflags "-s -w" -o tls-sidecar.exe .
        if (-not (Test-Path tls-sidecar.exe)) {
          throw "Go build failed: tls-sidecar.exe missing"
        }

    - name: Stage Go binary
      shell: pwsh
      run: |
        New-Item -ItemType Directory -Force build\bin | Out-Null
        Copy-Item tls-sidecar\tls-sidecar.exe build\bin\tls-sidecar.exe -Force

    # ─────────────────────────────────────────────
    # 6. STAGE NSSM
    # ─────────────────────────────────────────────
    - name: Install and stage NSSM
      shell: pwsh
      run: |
        choco install nssm --yes --no-progress
        $nssm = (Get-Command nssm -ErrorAction Stop).Source
        New-Item -ItemType Directory -Force build\nssm | Out-Null
        Copy-Item $nssm build\nssm\nssm.exe -Force
        if (-not (Test-Path build\nssm\nssm.exe)) {
          throw "NSSM staging failed"
        }
        Write-Host "NSSM staged from: $nssm"

    # ─────────────────────────────────────────────
    # 7. STAGE PORTABLE NODE RUNTIME
    # ─────────────────────────────────────────────
    - name: Download portable Node.js runtime
      shell: pwsh
      run: |
        $nodeDir = "build\node"
        New-Item -ItemType Directory -Force $nodeDir | Out-Null
        $zipPath = "$env:TEMP\node.zip"
        Invoke-WebRequest `
          -Uri "https://nodejs.org/dist/v${{ env.NODE_VERSION }}/node-v${{ env.NODE_VERSION }}-win-x64.zip" `
          -OutFile $zipPath `
          -UseBasicParsing `
          -TimeoutSec 120
        Expand-Archive $zipPath -DestinationPath "$env:TEMP\node-extract" -Force
        Copy-Item "$env:TEMP\node-extract\node-v${{ env.NODE_VERSION }}-win-x64\*" `
                  $nodeDir -Recurse -Force
        Write-Host "Node.js runtime staged to $nodeDir"

    # ─────────────────────────────────────────────
    # 8. INSTALL INNO SETUP (WITH ISPP)
    # ─────────────────────────────────────────────
    - name: Install Inno Setup
      shell: pwsh
      run: |
        winget install --id JRSoftware.InnoSetup `
          --silent `
          --accept-package-agreements `
          --accept-source-agreements

        "C:\Program Files (x86)\Inno Setup 6" | `
          Out-File -FilePath $env:GITHUB_PATH -Append
        $env:PATH += ";C:\Program Files (x86)\Inno Setup 6"

        $iscc = Get-Command iscc -ErrorAction SilentlyContinue
        if (-not $iscc) { throw "Inno Setup (iscc.exe) not found" }

        if (-not (Test-Path "C:\Program Files (x86)\Inno Setup 6\ISPP.dll")) {
          throw "ISPP.dll missing — preprocessor not installed"
        }
        Write-Host "Inno Setup ready: $($iscc.Source)"

    # ─────────────────────────────────────────────
    # 9. FIX .ISS FILE (ISPP + UNICODE + PASCAL BUG)
    # ─────────────────────────────────────────────
    - name: Patch .iss credits line
      shell: pwsh
      run: |
        $ver = "${{ steps.version.outputs.FULL }}"
        $issPath = "installer\BlacklistedProxy.iss"
        $lines = [System.IO.File]::ReadAllLines($issPath, [System.Text.Encoding]::UTF8)

        $patched = $false
        for ($i = 0; $i -lt $lines.Length; $i++) {
          if ($lines[$i] -match "BlacklistedAIProxy v\{#AppVersion\}") {
            Write-Host "Found target on line $($i+1): $($lines[$i])"
            # Hard-inject the version string directly to avoid Pascal Script WideString concatenation mismatch
            $lines[$i] = $lines[$i] -replace "\{#AppVersion\}", $ver
            Write-Host "Patched to: $($lines[$i])"
            $patched = $true
          }
        }

        if ($patched) {
          [System.IO.File]::WriteAllLines($issPath, $lines, [System.Text.Encoding]::UTF8)
          Write-Host "File saved successfully"
        } else {
          Write-Host "WARNING: target line not found."
        }

    # ─────────────────────────────────────────────
    # 10. GENERATE PORTABLE APP ZIP
    # ─────────────────────────────────────────────
    - name: Generate Portable App Zip
      shell: pwsh
      run: |
        New-Item -ItemType Directory -Force build | Out-Null
        
        $pathsToZip = @()
        $possiblePaths = @("src", "configs", "static", "node_modules", "package.json", "package-lock.json", "VERSION", "LICENSE", "README.md", "docs", "tls-sidecar\tls-sidecar.exe")
        
        foreach ($path in $possiblePaths) {
            if (Test-Path $path) {
                $pathsToZip += $path
            }
        }
        
        if ($pathsToZip.Count -gt 0) {
            Compress-Archive -Path $pathsToZip -DestinationPath "build\BlacklistedAIProxy-portable.zip" -Force
            Write-Host "Portable zip generated successfully at build\BlacklistedAIProxy-portable.zip"
        } else {
            throw "No source files found to compress into the portable zip."
        }

    # ─────────────────────────────────────────────
    # 11. COMPILE INSTALLER
    # ─────────────────────────────────────────────
    - name: Build installer
      shell: pwsh
      run: |
        $ver    = "${{ steps.version.outputs.FULL }}"
        $verNum = "${{ steps.version.outputs.BASE }}.1"

        New-Item -ItemType Directory -Force Output | Out-Null

        iscc `
          /D"AppVersion=$ver" `
          /D"AppVersionNumeric=$verNum" `
          installer\BlacklistedProxy.iss

        if ($LASTEXITCODE -ne 0) { throw "Inno Setup compilation failed" }

        $installer = "Output\BlacklistedAIProxy-Setup-$ver-win-x64.exe"
        if (-not (Test-Path $installer)) { throw "Installer artifact missing" }

        $size = [math]::Round((Get-Item $installer).Length / 1MB, 2)
        Write-Host "Installer OK: $size MB — $installer"

        "INSTALLER=$installer" | Out-File -FilePath $env:GITHUB_ENV -Append

    # ─────────────────────────────────────────────
    # 12. SMOKE TEST
    # ─────────────────────────────────────────────
    - name: Smoke test
      shell: pwsh
      run: |
        $dir = "$env:TEMP\BPA-test"
        Remove-Item $dir -Recurse -Force -ErrorAction SilentlyContinue
        Start-Process $env:INSTALLER `
          -ArgumentList "/SILENT /DIR=`"$dir`"" `
          -Wait
        $check = Join-Path $dir "src\core\master.js"
        if (-not (Test-Path $check)) {
          throw "Smoke test failed: $check not found"
        }
        Write-Host "Smoke test passed"

    # ─────────────────────────────────────────────
    # 13. UPLOAD ARTIFACT
    # ─────────────────────────────────────────────
    - name: Upload artifact
      uses: actions/upload-artifact@v4
      with:
        name: BlacklistedAIProxy-${{ steps.version.outputs.FULL }}
        path: ${{ env.INSTALLER }}
        retention-days: 30

    # ─────────────────────────────────────────────
    # 14. RELEASE (TAG PUSHES ONLY)
    # ─────────────────────────────────────────────
    - name: Release
      if: startsWith(github.ref, 'refs/tags/v')
      shell: pwsh
      env:
        GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      run: |
        gh release create "v${{ steps.version.outputs.FULL }}" `
          --prerelease `
          --title "BlacklistedAIProxy ${{ steps.version.outputs.FULL }}" `
          --notes "Automated deterministic build" `
          $env:INSTALLER
