name: BlacklistedAIProxy Deterministic Build

on:
  push:
    branches: [main, master]
    tags: ['v*']
  pull_request:
    branches: [main, master]
  workflow_dispatch:

permissions:
  contents: write

env:
  NODE_VERSION: 20.17.0
  GO_VERSION: 1.22.0
  NSSM_VERSION: 2.24

jobs:
  build:
    runs-on: windows-2025

    steps:

    # ─────────────────────────────────────────────
    # 1. SOURCE CHECKOUT (PINNED STATE)
    # ─────────────────────────────────────────────
    - name: Checkout source
      uses: actions/checkout@v4

    # ─────────────────────────────────────────────
    # 2. VERSION RESOLUTION (IMMUTABLE OUTPUT)
    # ─────────────────────────────────────────────
    - name: Resolve version
      id: version
      shell: pwsh
      run: |
        $base = (Get-Content VERSION -Raw).Trim()
        $full = "$base-beta.1"

        "BASE=$base" | Out-File -FilePath $env:GITHUB_OUTPUT -Append
        "FULL=$full" | Out-File -FilePath $env:GITHUB_OUTPUT -Append

        Write-Host "Version locked: $full"

    # ─────────────────────────────────────────────
    # 3. TOOLCHAIN BOOTSTRAP (NO SYSTEM DEPENDENCY)
    # ─────────────────────────────────────────────
    - name: Setup Go (pinned)
      uses: actions/setup-go@v5
      with:
        go-version: ${{ env.GO_VERSION }}

    - name: Setup Node (pinned)
      uses: actions/setup-node@v4
      with:
        node-version: ${{ env.NODE_VERSION }}
        cache: npm

    # ─────────────────────────────────────────────
    # 4. INSTALL JS DEPENDENCIES (DETERMINISTIC)
    # ─────────────────────────────────────────────
    - name: Install dependencies
      shell: pwsh
      run: |
        npm ci --no-optional
        if ($LASTEXITCODE -ne 0) { exit 1 }

    # ─────────────────────────────────────────────
    # 5. BUILD GO COMPONENT (ISOLATED)
    # ─────────────────────────────────────────────
    - name: Build Go sidecar
      shell: pwsh
      working-directory: tls-sidecar
      env:
        CGO_ENABLED: "0"
        GOOS: windows
        GOARCH: amd64
      run: |
        go mod download
        go build -trimpath -ldflags "-s -w" -o tls-sidecar.exe .

        if (-not (Test-Path tls-sidecar.exe)) {
          throw "Go build failed: tls-sidecar.exe missing"
        }

    - name: Stage Go binary
      shell: pwsh
      run: |
        New-Item -ItemType Directory -Force build\bin | Out-Null
        Copy-Item tls-sidecar\tls-sidecar.exe build\bin\tls-sidecar.exe -Force

    # ─────────────────────────────────────────────
    # 6. TOOLING LAYER (ISOLATED ARTIFACTS)
    # ─────────────────────────────────────────────

    - name: Install NSSM (deterministic via choco)
      shell: pwsh
      run: |
        choco install nssm --yes --no-progress

        $nssm = (Get-Command nssm -ErrorAction Stop).Source

        New-Item -ItemType Directory -Force build\nssm | Out-Null
        Copy-Item $nssm build\nssm\nssm.exe -Force

        if (-not (Test-Path build\nssm\nssm.exe)) {
          throw "NSSM staging failed"
        }

    - name: Install Inno Setup (stable + verified)
      shell: pwsh
      run: |
        winget install --id JRSoftware.InnoSetup --silent --accept-package-agreements --accept-source-agreements

        $iscc = Get-Command iscc -ErrorAction SilentlyContinue
        if (-not $iscc) {
          throw "Inno Setup not available"
        }

        if (-not (Test-Path "C:\Program Files (x86)\Inno Setup 6\ISPP.dll")) {
          throw "Inno Setup preprocessor missing"
        }

    # ─────────────────────────────────────────────
    # 7. BUILD (NO SIDE EFFECTS)
    # ─────────────────────────────────────────────
    - name: Build installer
      shell: pwsh
      run: |
        $ver = "${{ steps.version.outputs.FULL }}"
        $verNum = "${{ steps.version.outputs.BASE }}.1"

        New-Item -ItemType Directory -Force Output | Out-Null

        iscc `
          /D"AppVersion=$ver" `
          /D"AppVersionNumeric=$verNum" `
          installer\BlacklistedProxy.iss

        if ($LASTEXITCODE -ne 0) {
          throw "Inno Setup compilation failed"
        }

        $installer = "Output\BlacklistedAIProxy-Setup-$ver-win-x64.exe"

        if (-not (Test-Path $installer)) {
          throw "Installer artifact missing"
        }

        $size = (Get-Item $installer).Length / 1MB
        Write-Host "Installer OK: $([math]::Round($size,2)) MB"

        "INSTALLER=$installer" | Out-File -FilePath $env:GITHUB_ENV -Append

    # ─────────────────────────────────────────────
    # 8. VERIFICATION (STRICT ARTIFACT VALIDATION)
    # ─────────────────────────────────────────────
    - name: Smoke test
      shell: pwsh
      run: |
        $dir = "$env:TEMP\BPA-test"

        Remove-Item $dir -Recurse -Force -ErrorAction SilentlyContinue

        Start-Process $env:INSTALLER `
          -ArgumentList "/SILENT /DIR=`"$dir`"" `
          -Wait

        $exe = Join-Path $dir "BlacklistedAIProxy.exe"

        if (-not (Test-Path $exe)) {
          throw "Smoke test failed: runtime artifact missing"
        }

        Write-Host "Smoke test passed"

    # ─────────────────────────────────────────────
    # 9. ARTIFACT OUTPUT (SEPARATE FROM RELEASE)
    # ─────────────────────────────────────────────
    - name: Upload artifact
      uses: actions/upload-artifact@v4
      with:
        name: BlacklistedAIProxy-${{ steps.version.outputs.FULL }}
        path: ${{ env.INSTALLER }}

    # ─────────────────────────────────────────────
    # 10. RELEASE (ONLY ON TAGS)
    # ─────────────────────────────────────────────
    - name: Release
      if: startsWith(github.ref, 'refs/tags/v')
      shell: pwsh
      env:
        GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      run: |
        gh release create "v${{ steps.version.outputs.FULL }}" `
          --prerelease `
          --title "BlacklistedAIProxy ${{ steps.version.outputs.FULL }}" `
          --notes "Automated deterministic build" `
          $env:INSTALLER
